    .glass-card {

      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .animate-spin-slow {
      animation: spin 8s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #080d1a;

    const INITIAL_USERS = [
      {
        id: 'usr_cust_1',

        email: 'harsha@evolt.com',

      },
      {

      }
    ];

    // ==========================================
    // QR CODE HELPER COMPONENT
    // ==========================================
    function QRCodeDisplay({ value, size = 160 }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        if (canvasRef.current && window.QRCode) {
          QRCode.toCanvas(canvasRef.current, value, {
            width: size,
            margin: 1,
            color: {
              dark: '#000000',
              light: '#ffffff'
            }
          }, (err) => {
            if (err) console.error(err);
          });
        }
      }, [value, size]);

      return <canvas ref={canvasRef} className="rounded-xl shadow-md mx-auto block" />;
    }

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================
    function App() {
      // Global States
      const [currentUser, setCurrentUser] = useState(INITIAL_USERS[0]); // Default logged in as Customer
      const [activeTab, setActiveTab] = useState('search'); // search | history | merchant | profile
      const [stations, setStations] = useState(INITIAL_STATIONS);
      const [bookings, setBookings] = useState([
        {
          id: 'bk_demo_1',
          bookingCode: 'EV-88412',
          userId: 'usr_cust_1',
          userName: 'Harsha Vardhan',
          userEmail: 'harsha@evolt.com',
          userPhone: '9032976082',
          vehicleNumber: 'TS 09 EV 9999',
          stationId: 'stn_1',
          stationName: 'EVolt Demo SuperCharge Hub (₹1 Trial) - HITEC Cyber Towers',
          stationAddress: 'Near Cyber Towers Main Gate, HITEC City',
          stationCity: 'Hyderabad',
          portId: 'p1_1',
          portType: '150kW Ultra-Fast',
          powerKW: 150,
          unitsKWh: 1,
          voltageSelected: '800V DC',
          ratePerKWh: 1.00,
          energySubtotal: 1.00,
          convenienceFee: 2.00,
          taxAmount: 0.15,
          totalAmount: 3.15,
          slotTime: 'Today, Next 15 mins',
          status: 'confirmed',
          paymentStatus: 'paid',
          paymentRef: 'UPI/9032976082@ybl/EV88412',
          createdAt: new Date().toISOString(),
        }
      ]);

      const [searchRoute, setSearchRoute] = useState({
        from: 'HITEC City Metro & Cyber Towers',
        fromCoords: { lat: 17.4504, lng: 78.3808 },
        to: 'Rajiv Gandhi International Airport Shamshabad',
        toCoords: { lat: 17.2403, lng: 78.4294 },
      });

      // Modals
      const [bookingModalStation, setBookingModalStation] = useState(null);
      const [paymentBooking, setPaymentBooking] = useState(null);
      const [liveNavTarget, setLiveNavTarget] = useState(null);
      const [viewPassBooking, setViewPassBooking] = useState(null);
      const [viewInvoiceBooking, setViewInvoiceBooking] = useState(null);
      const [aiDrawerOpen, setAiDrawerOpen] = useState(false);
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login'); // login | signup_customer | signup_merchant

      // Filter States
      const [selectedAmenityFilter, setSelectedAmenityFilter] = useState('all');

      // Booking Form State
      const [bookUnits, setBookUnits] = useState(1);
      const [bookSlotTime, setBookSlotTime] = useState('Immediate (Next 15 mins)');
      const [bookVehicleNo, setBookVehicleNo] = useState(currentUser?.vehicleNumber || 'TS 09 EV 9999');

      // Live Navigation State
      const [isNavigating, setIsNavigating] = useState(false);
      const [isNavPaused, setIsNavPaused] = useState(false);
      const [navProgress, setNavProgress] = useState(0);
      const [navSpeed, setNavSpeed] = useState(52);
      const [navTransport, setNavTransport] = useState('car');
      const [navSound, setNavSound] = useState(true);
      const [navArrived, setNavArrived] = useState(false);

      // Payment Timer
      const [payTimeLeft, setPayTimeLeft] = useState(299);
      const [copiedUpi, setCopiedUpi] = useState(false);
      const [copiedRef, setCopiedRef] = useState(false);
      const [paySuccess, setPaySuccess] = useState(false);

      const PAYEE_UPI_ID = '9032976082@ybl';

      // Payment Countdown
      useEffect(() => {
        if (!paymentBooking || paySuccess) return;
        const timer = setInterval(() => {
          setPayTimeLeft(prev => prev > 0 ? prev - 1 : 0);
        }, 1000);
        return () => clearInterval(timer);
      }, [paymentBooking, paySuccess]);

      // Handle Booking Creation
      const handleCreateBooking = () => {
        if (!bookingModalStation) return;
        const rate = 1.00;
        const subtotal = Math.round(bookUnits * rate * 100) / 100;
        const convFee = 2.00;
        const gst = Math.round((subtotal + convFee) * 0.05 * 100) / 100;
        const total = Math.round((subtotal + convFee + gst) * 100) / 100;

        const newBk = {
          id: `bk_${Date.now()}`,
          bookingCode: `EV-${Math.floor(10000 + Math.random() * 90000)}`,
          userId: currentUser?.id || 'cust_guest',
          userName: currentUser?.name || 'EV Driver',
          userEmail: currentUser?.email || 'driver@evolt.com',
          userPhone: currentUser?.phone || '9032976082',
          vehicleNumber: bookVehicleNo.toUpperCase(),
          stationId: bookingModalStation.id,
          stationName: bookingModalStation.name,
          stationAddress: bookingModalStation.address,
          stationCity: bookingModalStation.city,
          portId: bookingModalStation.ports[0].id,
          portType: bookingModalStation.ports[0].type,
          powerKW: bookingModalStation.ports[0].powerKW,
          unitsKWh: bookUnits,
          voltageSelected: bookingModalStation.voltageRating,
          ratePerKWh: rate,
          energySubtotal: subtotal,
          convenienceFee: convFee,
          taxAmount: gst,
          totalAmount: total,
          slotTime: bookSlotTime,
          status: 'confirmed',
          paymentStatus: 'pending',
          paymentRef: `UPI/9032976082@ybl/EV${Math.floor(1000 + Math.random() * 9000)}`,
          createdAt: new Date().toISOString()
        };

        setBookingModalStation(null);
        setPaymentBooking(newBk);
        setPayTimeLeft(299);
        setPaySuccess(false);
      };

      // Handle Payment Confirmation
      const handleConfirmPayment = () => {
        if (!paymentBooking) return;
        confetti({
          particleCount: 100,
          spread: 70,
          origin: { y: 0.6 }
        });
        const updated = { ...paymentBooking, paymentStatus: 'paid' };
        setBookings(prev => [updated, ...prev]);
        setPaymentBooking(updated);
        setPaySuccess(true);
      };

      // Start Live Navigation
      const startLiveNav = (stationOrBooking) => {
        setLiveNavTarget({
          name: stationOrBooking.name || stationOrBooking.stationName,
          address: stationOrBooking.address || stationOrBooking.stationAddress,
          lat: stationOrBooking.lat || 17.4504,
          lng: stationOrBooking.lng || 78.3808,
        });
        setIsNavigating(false);
        setNavProgress(0);
        setNavArrived(false);
      };

      // Live Navigation Animation Loop
      useEffect(() => {
        if (!isNavigating || isNavPaused || navArrived) return;
        const interval = setInterval(() => {
          setNavProgress(prev => {
            if (prev >= 100) {
              setNavArrived(true);
              setIsNavigating(false);
              confetti({ particleCount: 80, spread: 60, origin: { y: 0.5 } });
              return 100;
            }
            const jitter = Math.floor(52 + (Math.random() * 8 - 4));
            setNavSpeed(jitter);
            return Math.min(100, prev + 1.5);
          });
        }, 350);
        return () => clearInterval(interval);
      }, [isNavigating, isNavPaused, navArrived]);

      // Filtered Stations
      const filteredStations = stations.filter(stn => {
        if (selectedAmenityFilter === 'all') return true;
        return stn.amenities.some(a => a.toLowerCase().includes(selectedAmenityFilter.toLowerCase()));
      });

      return (
        <div className="min-h-screen flex flex-col bg-[#080d1a] text-slate-100">

          {/* ======================================================== */}

                  </div>
                  <div className="text-[10px] text-slate-400 font-mono tracking-widest uppercase">Smart EV Grid</div>
                </div>
              </div>

              {/* Navigation Items */}
              <nav className="hidden md:flex items-center gap-1">
                <button
                  onClick={() => setActiveTab('search')}
                  className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 ${
                    activeTab === 'search' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  <span>📍 Route & Chargers</span>
                </button>

                <button
                  onClick={() => setActiveTab('history')}
                  className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 ${
                    activeTab === 'history' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  <span>⚡ My Bookings</span>
                  {bookings.length > 0 && (
                    <span className="w-5 h-5 rounded-full bg-emerald-500 text-black text-[10px] flex items-center justify-center font-black">
                      {bookings.length}
                    </span>
                  )}
                </button>

                {/* Role-Based Merchant Hub (Only for Merchants) */}
                {currentUser?.role === 'merchant' && (
                  <button
                    onClick={() => setActiveTab('merchant')}
                    className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 ${
                      activeTab === 'merchant' ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/40' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    <span>🏪 Merchant Hub</span>
                  </button>
                )}
              </nav>

              {/* Right User Bar */}
              <div className="flex items-center gap-3">
                
                {/* Demo Switcher (Only for Merchants) */}
                {currentUser?.role === 'merchant' && (
                  <div className="hidden sm:flex items-center bg-slate-900 border border-slate-800 rounded-xl p-1 text-xs">
                    <span className="text-slate-500 px-2 font-medium">Demo:</span>
                    <button
                      onClick={() => setCurrentUser(INITIAL_USERS[0])}
                      className="px-2 py-1 rounded text-slate-400 hover:text-emerald-400"
                    >
                      🚗 Driver
                    </button>
                    <button
                      onClick={() => setCurrentUser(INITIAL_USERS[1])}
                      className="px-2 py-1 rounded bg-cyan-500/20 text-cyan-300 font-bold border border-cyan-500/30"
                    >
                      ⚡ Host
                    </button>
                  </div>
                )}

                {/* AI Copilot Button */}
                <button
                  onClick={() => setAiDrawerOpen(true)}

                  <span className="animate-bounce">✨</span>
                  <span>Spark AI</span>

                {/* Auth Profile */}

                      <div className="text-xs font-bold text-slate-200">{currentUser.name}</div>
                      <div className="text-[10px] text-emerald-400 font-mono">
                        {currentUser.role === 'customer' ? currentUser.vehicleNumber : 'Station Owner'}

                    </div>
                    <button
                      onClick={() => setCurrentUser(null)}
                      className="p-2 rounded-xl text-slate-400 hover:text-rose-400 bg-slate-900 border border-slate-800"
                      title="Sign Out"
                    >
                      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    </button>
                  </div>
                ) : (
                  <button
                    onClick={() => { setAuthMode('login'); setAuthModalOpen(true); }}
                    className="px-4 py-2 rounded-xl bg-emerald-500 text-black font-extrabold text-xs shadow-lg shadow-emerald-500/20"
                  >
                    Sign In
                  </button>
                )}

              </div>
            </div>
          </header>

          {/* ======================================================== */}
          {/* BODY CONTENT */}
          {/* ======================================================== */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
            
            {/* TAB 1: ROUTE & CHARGERS */}
            {activeTab === 'search' && (
              <div className="space-y-6">
                
                {/* Search Inputs */}
                <div className="glass-panel p-6 rounded-3xl border border-slate-800 space-y-4 shadow-xl">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2 text-emerald-400 text-xs font-bold uppercase tracking-wider">
                      <span>⚡ Smart Route Highway & City Planner</span>
                    </div>
                    <span className="text-xs text-slate-400">Live GPS Active</span>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="relative">
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Starting Point</label>
                      <input
                        type="text"
                        value={searchRoute.from}
                        onChange={(e) => setSearchRoute(prev => ({ ...prev, from: e.target.value }))}
                        className="w-full px-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                    <div className="relative">
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Destination</label>
                      <input
                        type="text"
                        value={searchRoute.to}
                        onChange={(e) => setSearchRoute(prev => ({ ...prev, to: e.target.value }))}
                        className="w-full px-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>
                  </div>
                </div>

                {/* Highlighted Lifestyle Amenities Filter */}
                <div className="glass-card p-4 rounded-2xl border border-slate-800 space-y-2">
                  <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                    <span>✨ Filter by Lifestyle Amenities while Charging:</span>
                  </div>
                  <div className="flex items-center gap-2 flex-wrap">
                    {[
                      { id: 'all', label: 'All Highlights' },
                      { id: 'restaurant', label: '🍽️ Restaurants' },
                      { id: 'playstation', label: '🎮 Kids PlayStation' },
                      { id: 'baker', label: '🥐 Bakeries' },
                      { id: 'cafe', label: '☕ Cafeteria' },
                      { id: 'mall', label: '🛍️ Shopping Mall' },
                      { id: 'food court', label: '🍕 Food Courts' },
                    ].map(f => (
                      <button
                        key={f.id}
                        onClick={() => setSelectedAmenityFilter(f.id)}
                        className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${
                          selectedAmenityFilter === f.id
                            ? 'bg-emerald-500 text-black shadow-md'
                            : 'bg-slate-900 text-slate-400 hover:text-white border border-slate-800'
                        }`}
                      >
                        {f.label}
                      </button>
                    ))}
                  </div>

                      />
                      {/* Moving Vehicle Cursor */}
                      <div
                        className="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 transition-all duration-300"
                        style={{ left: `${navProgress}%` }}
                      >
                        <div className="w-8 h-8 rounded-full bg-emerald-500 border-2 border-white flex items-center justify-center text-black text-sm shadow-xl shadow-emerald-500/50">
                          🚗
                        </div>
                      </div>
                    </div>

                    <div className="flex justify-between text-[11px] text-slate-400 font-mono">
                      <span>0 KM</span>
                      <span>Corridor: via Outer Ring Road</span>
                      <span>28.5 KM</span>
                    </div>
                  </div>
                </div>

                {/* Bottom Live Metrics & Controls */}
                <div className="p-4 bg-slate-950 border-t border-slate-800 space-y-3 z-10">
                  <div className="grid grid-cols-4 gap-2 text-xs">
                    <div className="p-2.5 bg-slate-900 rounded-xl border border-slate-800">
                      <div className="text-[10px] text-slate-400">EST. TIME</div>
                      <div className="text-sm font-black text-white font-mono">{Math.max(0, Math.ceil(34 * (1 - navProgress / 100)))} Mins</div>
                    </div>
                    <div className="p-2.5 bg-slate-900 rounded-xl border border-slate-800">
                      <div className="text-[10px] text-slate-400">DISTANCE</div>
                      <div className="text-sm font-black text-cyan-300 font-mono">{Math.max(0, parseFloat((28.5 * (1 - navProgress / 100)).toFixed(1)))} KM</div>
                    </div>
                    <div className="p-2.5 bg-slate-900 rounded-xl border border-slate-800">
                      <div className="text-[10px] text-slate-400">GPS SPEED</div>
                      <div className="text-sm font-black text-amber-300 font-mono">{isNavigating && !isNavPaused ? `${navSpeed} km/h` : '0 km/h'}</div>
                    </div>
                    <div className="p-2.5 bg-slate-900 rounded-xl border border-slate-800">
                      <div className="text-[10px] text-slate-400">ARRIVAL BATTERY</div>
                      <div className="text-sm font-black text-purple-300 font-mono">~{Math.max(12, 85 - Math.round(15 * (navProgress / 100)))}%</div>
                    </div>
                  </div>

                  <div className="flex items-center gap-3">
                    {!isNavigating ? (
                      <button
                        onClick={() => { setIsNavigating(true); setIsNavPaused(false); setNavProgress(0); }}
                        className="flex-1 py-3.5 bg-gradient-to-r from-emerald-500 via-teal-400 to-cyan-500 text-black font-black text-sm rounded-2xl shadow-xl shadow-emerald-500/25 flex items-center justify-center gap-2"
                      >
                        <span>🟢 START NAVIGATION</span>
                      </button>
                    ) : (
                      <div className="flex-1 flex gap-2">
                        <button
                          onClick={() => setIsNavPaused(!isNavPaused)}
                          className="flex-1 py-3 bg-slate-800 text-white font-bold text-xs rounded-xl"
                        >
                          {isNavPaused ? '▶ Resume' : '⏸ Pause'}
                        </button>
                        <button
                          onClick={() => { setIsNavigating(false); setNavProgress(0); }}
                          className="px-5 py-3 bg-rose-500/20 text-rose-300 border border-rose-500/30 font-bold text-xs rounded-xl"
                        >
                          Exit
                        </button>
                      </div>
                    )}
                  </div>
                </div>

              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* STATION PASS QR POPUP */}
          {/* ======================================================== */}
          {viewPassBooking && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="relative w-full max-w-sm bg-slate-900 border border-slate-700 rounded-3xl p-6 text-center space-y-4 shadow-2xl">
                <button onClick={() => setViewPassBooking(null)} className="absolute top-4 right-4 p-2 text-slate-400 hover:text-white">✕</button>
                <div className="text-xs font-bold text-emerald-400 uppercase tracking-widest">Official EV Pass</div>
                <h3 className="text-lg font-bold text-white">{viewPassBooking.stationName}</h3>
                
                <div className="p-3 bg-white rounded-2xl inline-block shadow-lg">
                  <QRCodeDisplay value={`EVOLT_PASS:${viewPassBooking.bookingCode}`} size={160} />
                </div>

                <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 text-xs text-left space-y-1">
                  <div>Code: <strong className="text-emerald-400 font-mono">{viewPassBooking.bookingCode}</strong></div>
                  <div>Vehicle: <strong className="text-white font-mono">{viewPassBooking.vehicleNumber}</strong></div>
                  <div>Energy: <strong className="text-white">{viewPassBooking.unitsKWh} kWh ({viewPassBooking.portType})</strong></div>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <button onClick={() => setViewPassBooking(null)} className="py-2.5 bg-slate-800 text-slate-300 font-bold text-xs rounded-xl">Close</button>
                  <button
                    onClick={() => { const b = viewPassBooking; setViewPassBooking(null); startLiveNav(b); }}
                    className="py-2.5 bg-emerald-500 text-black font-extrabold text-xs rounded-xl"
                  >
                    ▶ Navigate
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* TAX INVOICE POPUP */}
          {/* ======================================================== */}
          {viewInvoiceBooking && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="relative w-full max-w-md bg-slate-900 border border-slate-700 rounded-3xl p-6 space-y-4 shadow-2xl text-xs">
                <button onClick={() => setViewInvoiceBooking(null)} className="absolute top-4 right-4 p-2 text-slate-400 hover:text-white">✕</button>
                <div className="flex justify-between items-center pb-3 border-b border-slate-800">
                  <div className="text-base font-black text-white font-display">eVolt Tax Invoice</div>
                  <div className="font-mono text-emerald-400 font-bold">#{viewInvoiceBooking.bookingCode}</div>
                </div>
                <div className="space-y-1.5 text-slate-300">
                  <div>Station: <strong>{viewInvoiceBooking.stationName}</strong></div>
                  <div>Vehicle: <strong>{viewInvoiceBooking.vehicleNumber}</strong></div>
                  <div>Units Charged: <strong>{viewInvoiceBooking.unitsKWh} kWh @ ₹1.00/u</strong></div>
                </div>
                <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-1">
                  <div className="flex justify-between text-slate-400"><span>Energy Base:</span><span>₹{viewInvoiceBooking.energySubtotal.toFixed(2)}</span></div>
                  <div className="flex justify-between text-slate-400"><span>Network Fee:</span><span>₹{viewInvoiceBooking.convenienceFee.toFixed(2)}</span></div>
                  <div className="flex justify-between text-slate-400"><span>GST (5%):</span><span>₹{viewInvoiceBooking.taxAmount.toFixed(2)}</span></div>
                  <div className="pt-2 border-t border-slate-800 flex justify-between font-bold text-white text-sm">
                    <span>Total Amount:</span><span className="text-emerald-400">₹{viewInvoiceBooking.totalAmount.toFixed(2)}</span>
                  </div>
                </div>
                <button onClick={() => { alert('Receipt downloaded.'); setViewInvoiceBooking(null); }} className="w-full py-2.5 bg-emerald-500 text-black font-bold rounded-xl">
                  Download Receipt
                </button>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* SPARK AI ASSISTANT DRAWER */}
          {/* ======================================================== */}
          {aiDrawerOpen && (
            <div className="fixed inset-0 z-50 flex justify-end bg-black/60 backdrop-blur-sm">
              <div className="w-full max-w-md bg-slate-900 border-l border-slate-800 h-full p-6 flex flex-col justify-between shadow-2xl animate-in slide-in-from-right">
                <div className="flex items-center justify-between pb-4 border-b border-slate-800">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">✨</span>
                    <div>
                      <h3 className="font-bold text-white">Spark AI Copilot</h3>
                      <p className="text-[10px] text-purple-400">Smart EV Assistant</p>
                    </div>
                  </div>
                  <button onClick={() => setAiDrawerOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <div className="flex-1 py-4 space-y-3 overflow-y-auto text-xs">
                  <div className="p-3 bg-purple-500/10 border border-purple-500/20 rounded-2xl text-purple-200">
                    Hello! I can calculate your EV range, suggest fastest charging stations along your route, and check slot availability.
                  </div>
                  <div className="p-3 bg-slate-950 border border-slate-800 rounded-2xl text-slate-300">
                    💡 <strong>Tip:</strong> The ₹1 Trial Hub at HITEC Cyber Towers is currently available with 3 free fast charging ports.
                  </div>
                </div>
                <div className="pt-3 border-t border-slate-800 flex gap-2">
                  <input
                    type="text"
                    placeholder="Ask Spark AI anything..."
                    className="flex-1 px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white"
                  />
                  <button className="px-4 py-2 bg-purple-500 text-white font-bold text-xs rounded-xl">Send</button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="w-full bg-[#050811] border-t border-slate-800/80 py-6 text-center text-xs text-slate-500 mt-12">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
              <div className="font-bold text-slate-300 font-display">EVolt Smart Mobility Network</div>
              <div className="text-emerald-400 font-mono">Status: All Stations Online • 100% Green Energy</div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
